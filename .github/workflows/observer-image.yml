name: observer-image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install the pinned editor
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source clients/godot-observer/export/pins.env
          set +a
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA=libasound2t64
          else
            ALSA=libasound2
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl unzip \
            "$ALSA" libdbus-1-3 libegl1 libfontconfig1 libgl1 \
            libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 \
            libxkbcommon0 libxrandr2 libxrender1
          printf 'INFO observer_protocol_libs_ok packages=%s\n' \
            "libdbus-1-3 libegl1 libxkbcommon0"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/editor.zip" "$GODOT_LINUX_URL"
          echo "${GODOT_LINUX_SHA512}  $RUNNER_TEMP/editor.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/editor"
          install -m 755 \
            "$RUNNER_TEMP/editor/Godot_v4.7.2-stable_linux.x86_64" \
            "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --editor \
            --path clients/godot-observer \
            --quit
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path clients/godot-observer \
            --script res://tests/run_protocol.gd

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Build the runtime image
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            printf 'dirty checkout cannot assert a clean source\n' >&2
            exit 1
          fi
          docker build \
            --build-arg "PALIMPSEST_REVISION=${GITHUB_SHA}" \
            --build-arg "PALIMPSEST_SOURCE_CLEAN=true" \
            -t palimpsest-api:ci \
            .

      - name: Assert the runtime image has no editor
        run: |
          set -euo pipefail
          hits="$(docker run --rm --user root --entrypoint find palimpsest-api:ci / -iname '*godot*' -print || true)"
          if printf '%s\n' "$hits" | grep -qi 'godot'; then
            printf 'runtime image still contains an editor path\n' >&2
            exit 1
          fi

      - name: Export the web directory artifact
        run: |
          set -euo pipefail
          cid="$(docker create palimpsest-api:ci)"
          mkdir -p observer-web
          docker cp "$cid:/app/share/observer-web/." observer-web
          docker rm "$cid"
          wasm_bytes="$(wc -c < observer-web/index.wasm | tr -d '[:space:]')"
          printf 'INFO ci_export_ok wasm_bytes=%s\n' "$wasm_bytes"

      - name: Upload the web directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: observer-web
          path: observer-web

      - name: Start the published compose file
        run: |
          set -euo pipefail
          image="$(awk '/pgvector\/pgvector/ { print $2; exit }' compose.yaml)"
          docker pull "$image"
          export PALIMPSEST_API_IMAGE=palimpsest-api:ci
          export PALIMPSEST_API_PUBLISH_PORT=8080
          docker compose -f compose.yaml up -d --wait --wait-timeout 180 --pull never

      - name: Smoke the served observer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import tomllib
          import urllib.request

          base = "http://127.0.0.1:8080"
          expected = {
              "/": "text/html",
              "/index.js": "text/javascript",
              "/index.wasm": "application/wasm",
              "/index.pck": "application/octet-stream",
          }
          for path, media in expected.items():
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  raw = response.read()
                  content_type = response.headers.get("Content-Type", "").split(";", 1)[0]
                  if content_type != media:
                      raise SystemExit(f"content_type path={path}")
                  if path == "/index.wasm" and len(raw) < 4096:
                      raise SystemExit("wasm_trivial")
                  if path == "/" and b"<html" not in raw.lower() and b"<!doctype html" not in raw.lower():
                      raise SystemExit("html_missing")
          with urllib.request.urlopen(base + "/version", timeout=10) as response:
              body = json.load(response)
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if body["application_version"] != version:
              raise SystemExit("application_version")
          if body["protocol_version"] != "observer-protocol-v1":
              raise SystemExit("protocol_version")
          if body["export_engine"] != "4.7.2-stable":
              raise SystemExit("export_engine")
          if not body["revision"]:
              raise SystemExit("revision")
          PY
          printf 'INFO ci_smoke_ok url=%s\n' "http://127.0.0.1:8080/"

      - name: Start the reference world
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.12.14
          uv run --frozen --python 3.12.14 python tests/compose/start_reference.py \
            --base-url http://127.0.0.1:8080

      - name: Install Playwright for the acceptance job
        run: |
          set -euo pipefail
          uv pip install playwright
          uv run playwright install --with-deps chromium

      - name: Run required client acceptance
        env:
          PALIMPSEST_API_IMAGE: palimpsest-api:ci
          PALIMPSEST_V3_ACCEPTANCE_REQUIRED: "1"
          PALIMPSEST_API_PUBLISH_PORT: "8080"
        run: |
          set -euo pipefail
          mkdir -p acceptance-reports
          uv run --no-sync pytest -m compose -q \
            --junitxml=acceptance-reports/required.xml \
            tests/compose/test_stack.py \
            tests/compose/test_observer_browser.py \
            tests/compose/test_observer_generational_browser.py \
            tests/compose/test_observer_civilization_browser.py \
            tests/compose/test_generational_research_ui_browser.py \
            tests/compose/test_research_ui_wiring.py \
            tests/compose/test_v3_benchmark_release.py

      - name: Assert required acceptance executed without skips
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          expected = {
              "test_stack",
              "test_observer_browser",
              "test_observer_generational_browser",
              "test_observer_civilization_browser",
              "test_generational_research_ui_browser",
              "test_research_ui_wiring",
              "test_v3_benchmark_release",
          }
          root = ET.parse("acceptance-reports/required.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          seen: set[str] = set()
          for suite in suites:
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.iter("testcase"):
                  name = (case.get("classname") or "").rsplit(".", 1)[-1]
                  if name:
                      seen.add(name)
          print(
              "required_acceptance tests={tests} failures={failures} "
              "errors={errors} skipped={skipped}".format(**totals)
          )
          if totals["tests"] == 0:
              raise SystemExit("required_acceptance_not_collected")
          if totals["failures"] or totals["errors"]:
              raise SystemExit("required_acceptance_failed")
          if totals["skipped"]:
              raise SystemExit("required_acceptance_skipped")
          missing = expected - seen
          if missing:
              raise SystemExit(
                  "required_modules_missing:" + ",".join(sorted(missing))
              )
          PY

      - name: Retain redacted acceptance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v3-acceptance-reports
          path: acceptance-reports
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          docker tag palimpsest-api:ci "ghcr.io/deliium/palimpsest:${version}"
          docker tag palimpsest-api:ci "ghcr.io/deliium/palimpsest:${GITHUB_SHA}"
          docker push "ghcr.io/deliium/palimpsest:${version}"
          docker push "ghcr.io/deliium/palimpsest:${GITHUB_SHA}"

      - name: Attach the web archive to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C observer-web -czf observer-web.tar.gz .
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" observer-web.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" observer-web.tar.gz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
