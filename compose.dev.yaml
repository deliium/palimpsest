# Local image build for contributors. Compose does not load this file
# automatically. `./run-dev.sh` passes it explicitly with compose.yaml.
#
# Optional Research UI development: the release image already ships the built
# SPA at /app/share/research-web. Contributors may instead build
# `pnpm --dir clients/research-ui build`, bind-mount that dist to
# /app/share/research-ui via an override, and set
# PALIMPSEST_RESEARCH_WEB_ROOT=/app/share/research-ui. The default below keeps
# the image's own SPA tree. Missing index.html skips the /research/ mount
# (ERROR reason code).

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        PALIMPSEST_REVISION: ${PALIMPSEST_REVISION:-unknown}

  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        PALIMPSEST_REVISION: ${PALIMPSEST_REVISION:-unknown}
    environment:
      PALIMPSEST_RESEARCH_WEB_ROOT: ${PALIMPSEST_RESEARCH_WEB_ROOT:-/app/share/research-web}
      PALIMPSEST_RESEARCH_MATRIX_ROOT: ${PALIMPSEST_RESEARCH_MATRIX_ROOT:-}
